<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KFZ-APP V26.07.26</title>
  <link id="favicon" rel="icon" href="">
  <style>
    :root{
      --primary:#1f4e79; --primaryDark:#153a5a; --secondary:#d9eaf7; --accent:#fff2cc;
      --bg:#f4f7fb; --surface:#ffffff; --surface2:#f8fbff; --text:#19202a; --muted:#667085; --border:#d7dee8;
      --success:#dff3df; --warning:#fff0cc; --danger:#ffd6d6; --tableText:#111827; --headText:#12355b;
      --shadow:0 14px 38px rgba(31,78,121,.13); --softShadow:0 8px 24px rgba(31,78,121,.09);
      --radius:18px; --logoSize:42px; --density-cell-y:5px; --density-cell-x:7px; --fontScale:1;
    }
    body.dark{
      --primary:#6fb3e8; --primaryDark:#0d253a; --secondary:#17344f; --accent:#3c331b;
      --bg:#0c1521; --surface:#132233; --surface2:#0f1c2b; --text:#ecf3ff; --muted:#8ea3bf; --border:#233950;
      --success:#173d29; --warning:#453614; --danger:#4a1d1d; --tableText:#edf5ff; --headText:#edf5ff;
      --shadow:0 14px 38px rgba(0,0,0,.35); --softShadow:0 8px 24px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth;scroll-padding-top:125px} 
    body{margin:0;background:radial-gradient(circle at 15% -10%, color-mix(in srgb,var(--secondary) 58%, transparent), transparent 34rem),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Aptos,Arial,sans-serif;font-size:calc(13px * var(--fontScale));min-height:100vh;} 
    body.modal-open{overflow:hidden} button,input,select,textarea{font:inherit} a{color:var(--primary)}
    button,.btn{border:0;background:linear-gradient(180deg,var(--primary),var(--primaryDark));color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(31,78,121,.12);text-decoration:none}
    button:hover,.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
    button:active{transform:translateY(1px)}
    button.secondary,.btn.secondary{background:var(--secondary);color:var(--primary);box-shadow:none;border:1px solid var(--border)}
    button.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);box-shadow:none}
    button.danger{background:#b42318;color:#fff}
    button.small{font-size:11px;padding:4px 8px;border-radius:8px;box-shadow:none}
    button[disabled]{opacity:.45;cursor:not-allowed;transform:none} 
    input,select,textarea{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:8px 11px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%, transparent)}
    textarea{min-height:90px;resize:vertical}
    .hidden{display:none!important}
    .hint{color:var(--muted);font-size:12px}
    .kbd{font-family:ui-monospace,monospace;border:1px solid var(--border);padding:2px 6px;border-radius:7px;background:var(--surface2)}
    
    /* Login-Maske unsichtbar halten */
    #loginView, .login-panel { display: none !important; }

    .app{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#112235 0%,#0d1a29 100%);border-bottom:1px solid var(--border);color:#fff;padding:8px clamp(14px,3vw,28px)}
    .topbar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:1840px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand img{width:var(--logoSize);height:var(--logoSize);border-radius:11px;object-fit:contain;background:rgba(255,255,255,.94);padding:3px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
    .brand-title{display:grid;gap:1px}
    .brand-title h1{font-size:clamp(17px,2vw,22px);line-height:1.1;margin:0;letter-spacing:.3px}
    .brand-title span{font-size:11px;opacity:.8}
    .top-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .user-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-weight:800;font-size:12px}
    .version-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;font-weight:800;font-size:11px}

    /* Demo-Steuerung unten links */
    .demo-bar{position:fixed;left:18px;bottom:18px;z-index:60;background:rgba(15,27,41,.92);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .demo-bar select{padding:4px 8px;font-size:11px;border-radius:8px;background:var(--surface2);color:#fff;border:1px solid var(--border)}
    .demo-bar button{padding:5px 10px;font-size:11px;border-radius:8px}

    /* Schwebende Icons unten rechts */
    .release-float{position:fixed;right:80px;bottom:18px;z-index:60;box-shadow:var(--shadow);cursor:pointer}
    .floating-gear{position:fixed;right:18px;bottom:18px;z-index:60;width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(180deg,#1d6fa5,#144f77);border:1px solid #2772b0;border-radius:50%;cursor:pointer;box-shadow:var(--shadow);font-size:20px;color:#fff;transition:transform .2s ease}
    .floating-gear:hover{transform:rotate(45deg) scale(1.05)}
    .neu-badge{position:fixed;right:22px;bottom:66px;z-index:60;background:#f59e0b;color:#000;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;box-shadow:0 4px 10px rgba(245,158,11,.4);pointer-events:none}

    .tabs{position:sticky;top:54px;z-index:40;background:rgba(12,21,33,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:8px clamp(14px,3vw,28px);display:flex;gap:6px;overflow:auto}
    .tab{white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:6px 14px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .tab.active{background:linear-gradient(180deg,#1b5382,#143d61);color:#fff;border-color:#2772b0}
    .tab .type{font-size:10px;opacity:.75}

    main{padding:16px clamp(14px,3vw,28px) 100px;max-width:1840px;margin:0 auto}
    .sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
    .sheet-title{min-width:0}
    .sheet-title h2{margin:0;color:#fff;font-size:22px;font-weight:800}
    .sheet-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .pill{font-size:11px;border-radius:999px;background:var(--secondary);color:var(--primary);padding:4px 9px;font-weight:800}
    .pill.ok{background:#133a24;color:#6ee7b7}
    .pill.warn{background:var(--warning);color:#fcd34d}
    .sheet-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    
    .vehicle-panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--softShadow)}
    .vehicle-panel label{font-weight:900;color:#9bbcdb}
    .vehicle-panel input{width:140px;text-align:right;font-weight:900}
    
    .global-search{display:flex;gap:10px;align-items:center;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--softShadow)}
    .global-search input{min-width:260px;flex:1}
    .search-results{display:grid;gap:8px;margin-bottom:12px}
    .search-hit{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
    
    .topic-nav{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--softShadow);margin-bottom:14px}
    .topic-nav a{white-space:nowrap;text-decoration:none;background:var(--surface2);color:#9bbcdb;padding:5px 12px;border-radius:999px;font-weight:800;font-size:11px;border:1px solid var(--border)}
    .topic-nav a:hover{background:var(--secondary);color:#fff;border-color:var(--primary)}
    
    .topic-stack{display:grid;gap:16px}
    .topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .topic-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;background:linear-gradient(180deg,#172a3f,#122234);border-bottom:1px solid var(--border)}
    .topic-head h3{margin:0;color:#fff;font-size:16px;font-weight:800}
    .topic-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
    .topic-card.collapsed .topic-body,.topic-card.collapsed .topic-foot{display:none}
    .topic-body{overflow:auto}
    .table-wrap{overflow:auto;max-height:72vh}
    
    .kfz-table{width:100%;border-collapse:collapse;font-size:12px;min-width:max-content;color:var(--tableText)}
    .kfz-table th{background:#182e44;color:#c5d8ed;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 8px;text-align:center;vertical-align:middle;font-weight:700;white-space:nowrap}
    .kfz-table thead tr:first-child th{background:#142537;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8da4be}
    
    /* Spaltenkopf-Buttons im Standardzustand verbergen, erst bei Hover einblenden */
    .kfz-table th button, .kfz-table th .btn, .kfz-table th [data-action]{display:none!important}
    .kfz-table th:hover button, .kfz-table th:hover .btn, .kfz-table th:hover [data-action]{
      display:inline-flex!important;padding:2px 5px!important;margin-left:3px!important;font-size:10px!important;height:18px!important;min-width:18px!important;border-radius:4px!important;box-shadow:none!important;
    }
    
    .row-tools{width:36px;min-width:36px;position:sticky;left:0;z-index:3;background:var(--surface2)!important}
    .kfz-table td{position:relative;background:var(--cellBg,var(--surface));border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--density-cell-y) var(--density-cell-x);vertical-align:middle;white-space:nowrap}
    .kfz-table td.status-ok{background:var(--success)!important}
    .kfz-table td.status-warn{background:var(--warning)!important}
    .kfz-table td.status-danger{background:var(--danger)!important}
    .kfz-table tr:nth-child(even) td:not(.row-tools):not([style*="--cellBg"]){background:#0f1c2b}
    .kfz-table tr:hover td{background:#162c44}
    
    .cell-inner{min-height:21px;display:flex;align-items:center;gap:5px}
    .cell-text{overflow:hidden;text-overflow:ellipsis;white-space:normal}
    .cell-link{font-weight:800;text-decoration:underline;color:var(--primary)}
    .cell-img{max-width:76px;max-height:54px;border-radius:8px;object-fit:contain;border:1px solid var(--border);background:#fff}
    .cell-icons{margin-left:auto;display:flex;gap:3px;opacity:0}
    .kfz-table td:hover .cell-icons{opacity:1}
    .cell-icon{font-size:10px;background:var(--secondary);color:var(--primary);border:0;border-radius:5px;padding:2px 4px;box-shadow:none}
    .note-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:0 0 auto}
    .formula-dot{font-size:11px;color:#6ee7b7;font-style:italic;font-weight:700}
    .insert-row td{padding:3px!important;background:var(--surface2)!important}
    .insert-row button{width:100%;background:transparent;color:var(--muted);border:1px dashed var(--border);box-shadow:none}
    .topic-foot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface2)}

    .file-section,.catalog-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
    .section-head h3{margin:0;color:#fff}
    .tree{display:grid;gap:4px}
    .tree-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:6px 10px;margin:3px 0;cursor:pointer}
    .tree-row .thumb{width:34px;height:28px;object-fit:cover;border-radius:6px;background:var(--secondary);display:grid;place-items:center;color:var(--primary);font-weight:800}
    .tree-children{margin-left:24px;border-left:2px dashed var(--border);padding-left:10px}
    .catalog-grid{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:16px}
    .catalog-table{width:100%;border-collapse:collapse}
    .catalog-table th,.catalog-table td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
    .catalog-table th{background:var(--secondary);color:var(--primary)}

    /* Modaldialoge */
    #modalRoot{position:relative;z-index:100}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
    .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);width:min(900px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
    .modal-head h3{margin:0;color:var(--primary)}
    .modal-body{padding:16px 18px;overflow:auto;display:grid;gap:14px}
    .modal-foot{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface2)}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark">

  <!-- Unsichtbare Login-Elemente für native Event-Verarbeitung von app.js -->
  <div id="loginView" class="login-panel">
    <div class="login-grid">
      <input id="loginUser" value="admin">
      <input id="loginPass" type="password" value="admin">
      <button id="loginBtn">Einloggen</button>
    </div>
    <div class="demo-users">
      <button class="quick-login" data-user="admin">Admin</button>
      <button class="quick-login" data-user="max">Max</button>
      <button class="quick-login" data-user="lea">Lea</button>
      <button class="quick-login" data-user="gast">Gast</button>
    </div>
    <div class="login-grid">
      <input id="regName">
      <input id="regEmail">
      <input id="regPass" type="password">
      <button id="registerBtn">Registrieren</button>
    </div>
  </div>

  <!-- Hauptansicht (Verwaltung ist oben entfernt) -->
  <div id="appView" class="app">
    <header class="topbar" id="top">
      <div class="topbar-row">
        <div class="brand">
          <img id="appLogo" alt="Logo">
          <div class="brand-title">
            <h1>KFZ-APP</h1>
            <span>Wartung · Teile · Werkzeug · Katalog</span>
          </div>
        </div>
        <div class="top-actions">
          <span class="version-chip" id="versionChip">V26.07.26</span>
          <span class="user-chip" id="userChip">👤 Admin Admin</span>
          <span class="version-chip" id="saveInfo">Auto · 03:20:02</span>
          <!-- Verwaltung ist unsichtbar im DOM hinterlegt, damit app.js nicht crasht -->
          <button id="adminBtn" class="secondary" style="display:none!important;">Verwaltung</button>
          <button id="saveBtn" class="secondary">Speichern</button>
          <button id="darkToggle" class="secondary">🌙</button>
          <button id="logoutBtn" class="secondary">Abmelden</button>
        </div>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>

    <!-- Die sichtbare Demo-Steuerung unten links -->
    <div class="demo-bar" id="demoBar"></div>

    <button class="release-float secondary" id="releaseBtn" style="display:none;">📝 Release Notes</button>
    
    <!-- Schwebendes Zahnrad & Neu-Badge unten rechts -->
    <div class="neu-badge">Neu</div>
    <div class="floating-gear" id="settingsGear" title="Verwaltung & Appeinstellungen">⚙</div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-stack" id="toastStack"></div>

  <!-- Original-Skripte -->
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/patch-v26.js"></script>
</body>
</html>
