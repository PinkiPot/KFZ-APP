<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KFZ-APP V26.07.26</title>
  <link id="favicon" rel="icon" href="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginView" class="login-panel">
  <h2>KFZ-APP Vorschau · V26.07.26</h2>
  <p class="hint">Demo im Stil der LH-Beispieldatei, mit simuliertem Supabase-Login und den KFZ-Daten aus der Original-Excel.</p>
  <div class="login-grid">
    <div class="field"><label>Benutzername oder E-Mail</label><input id="loginUser" value="admin"></div>
    <div class="field"><label>Passwort</label><input id="loginPass" type="password" value="admin"></div>
    <button id="loginBtn" class="full">Einloggen</button>
  </div>
  <div class="demo-users">
    <button class="quick-login secondary" data-user="admin">Admin</button>
    <button class="quick-login secondary" data-user="max">Max</button>
    <button class="quick-login secondary" data-user="lea">Lea</button>
    <button class="quick-login secondary" data-user="gast">Gast</button>
  </div>
  <hr>
  <h3>Registrierung testen</h3>
  <div class="login-grid">
    <input id="regName" placeholder="Name">
    <input id="regEmail" placeholder="E-Mail">
    <input id="regPass" placeholder="Passwort" type="password">
    <button id="registerBtn">Registrieren</button>
  </div>
</div>
<div id="appView" class="app hidden">
  <header class="topbar" id="top">
    <div class="topbar-row">
      <div class="brand"><img id="appLogo" alt="Logo"><div class="brand-title"><h1>KFZ-APP</h1><span>Wartung · Teile · Werkzeug · Katalog</span></div></div>
      <div class="top-actions"><span class="version-chip">V26.07.26</span><span class="user-chip" id="userChip"></span><span class="version-chip" id="saveInfo"></span><button id="darkToggle" class="secondary">🌙</button><button id="saveBtn" class="secondary">Speichern</button><button id="logoutBtn" class="secondary">Logout</button></div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <button class="release-float secondary" id="releaseBtn">📝 Release Notes</button>
  <div class="floating-gear" id="settingsGear"><span class="gear-symbol">⚙</span><span class="gear-label">Appeinstellungen</span></div>
  <div class="demo-bar" id="demoBar"></div>
</div>
<div id="modalRoot"></div><div class="toast-stack" id="toastStack"></div>

  <!-- App-Daten (Original Excel-Datenbank) -->
  <script src="js/data.js"></script>
  <!-- Kernanwendung KFZ-APP -->
  <script src="js/app.js"></script>
  <!-- Modul: V26 Erweiterungen & Hotspots -->
  <script src="js/patch-v26.js"></script>
</body>
</html>
